%%html

<!DOCTYPE html>
<html>

<head>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101010;
            color: white;
        }

        nav {
            background: #191919;
            padding: 15px;
            text-align: center;
            position: sticky;
            top: 0;
        }

        nav button {
            background: #252525;
            color: white;
            border: none;
            padding: 11px 15px;
            margin: 4px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        nav button:hover {
            background: #00a866;
        }

        .contenido {
            max-width: 900px;
            margin: auto;
            padding: 30px 20px;
            text-align: center;
        }

        h1 {
            color: #00ff88;
        }

        h2 {
            color: #00ff88;
        }

        .tarjeta {
            background: #1c1c1c;
            padding: 20px;
            margin: 12px auto;
            border-radius: 12px;
            max-width: 600px;
            border: 1px solid #292929;
        }

        .buscador {
            padding: 12px;
            width: 90%;
            max-width: 500px;
            border-radius: 8px;
            border: none;
            margin: 15px;
            font-size: 16px;
        }

        .badge {
            display: inline-block;
            background: #00a866;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
        }

        .vivo {
            color: #ff4444;
            font-weight: bold;
        }
    </style>
</head>

<body>

<nav>

    <button onclick="mostrar('inicio')">🏠 Inicio</button>
    <button onclick="mostrar('equipos')">⚽ Equipos</button>
    <button onclick="mostrar('jugadores')">👤 Jugadores</button>
    <button onclick="mostrar('partidos')">🏆 Partidos</button>
    <button onclick="mostrar('tabla')">📊 Tabla</button>

    <button onclick="mostrar('noticias')">📰 Noticias</button>
    <button onclick="mostrar('estadios')">🏟️ Estadios</button>
    <button onclick="mostrar('fichajes')">🔄 Fichajes</button>

</nav>

<div id="contenido" class="contenido"></div>

<script>

const equipos = [
    "Peñarol",
    "Nacional",
    "Cerro Largo",
    "Defensor Sporting",
    "Liverpool"
];

const jugadores = [
    "Federico Valverde",
    "Luis Suárez",
    "Darwin Núñez",
    "Facundo Torres",
    "Manuel Ugarte"
];

function mostrar(seccion) {

    let contenido = document.getElementById("contenido");

    if (seccion === "inicio") {

        contenido.innerHTML = `
            <h1>⚽ Fútbol Uruguay</h1>

            <div class="tarjeta">
                <h2>🔥 Bienvenido</h2>
                <p>Noticias, partidos, equipos, jugadores y mucho más.</p>
            </div>

            <div class="tarjeta">
                <span class="badge">🔴 EN VIVO</span>
                <h2>Peñarol vs Nacional</h2>
                <p>Partido destacado</p>
            </div>
        `;

    }

    else if (seccion === "equipos") {

        contenido.innerHTML = `
            <h1>⚽ Equipos</h1>

            <input
                class="buscador"
                id="buscarEquipo"
                placeholder="🔎 Buscar equipo..."
                oninput="buscarEquipo()"
            >

            <div id="listaEquipos"></div>
        `;

        mostrarListaEquipos(equipos);
    }

    else if (seccion === "jugadores") {

        contenido.innerHTML = `
            <h1>👤 Jugadores</h1>

            <input
                class="buscador"
                id="buscarJugador"
                placeholder="🔎 Buscar jugador..."
                oninput="buscarJugador()"
            >

            <div id="listaJugadores"></div>
        `;

        mostrarListaJugadores(jugadores);
    }

    else if (seccion === "partidos") {

        contenido.innerHTML = `
            <h1>🏆 Partidos</h1>

            <div class="tarjeta">
                <span class="vivo">🔴 EN VIVO</span>
                <h2>Peñarol 2 - 1 Nacional</h2>
                <p>Estadio Campeón del Siglo</p>
            </div>

            <div class="tarjeta">
                <h2>Cerro Largo 1 - 1 Liverpool</h2>
                <p>Próximo partido</p>
            </div>
        `;

    }

    else if (seccion === "tabla") {

        contenido.innerHTML = `
            <h1>📊 Tabla de posiciones</h1>

            <div class="tarjeta">🥇 Peñarol - 10 pts</div>
            <div class="tarjeta">🥈 Nacional - 8 pts</div>
            <div class="tarjeta">🥉 Liverpool - 6 pts</div>
            <div class="tarjeta">4️⃣ Cerro Largo - 4 pts</div>
            <div class="tarjeta">5️⃣ Defensor Sporting - 3 pts</div>
        `;

    }

    else if (seccion === "noticias") {

        contenido.innerHTML = `
            <h1>📰 Noticias</h1>

            <div class="tarjeta">
                <h2>🔥 Gran partido este fin de semana</h2>
                <p>Se viene un partido muy esperado entre dos grandes equipos.</p>
            </div>

            <div class="tarjeta">
                <h2>⭐ Nueva figura uruguaya</h2>
                <p>Un joven jugador comienza a destacarse.</p>
            </div>

            <div class="tarjeta">
                <h2>🏆 Se prepara el torneo</h2>
                <p>Los equipos ya se preparan para la nueva competición.</p>
            </div>
        `;

    }

    else if (seccion === "estadios") {

        contenido.innerHTML = `
            <h1>🏟️ Estadios</h1>

            <div class="tarjeta">
                <h2>🏟️ Campeón del Siglo</h2>
                <p>Peñarol</p>
            </div>

            <div class="tarjeta">
                <h2>🏟️ Gran Parque Central</h2>
                <p>Nacional</p>
            </div>

            <div class="tarjeta">
                <h2>🏟️ Estadio Luis Franzini</h2>
                <p>Defensor Sporting</p>
            </div>
        `;

    }

    else if (seccion === "fichajes") {

        contenido.innerHTML = `
            <h1>🔄 Mercado de fichajes</h1>

            <div class="tarjeta">
                <h2>⭐ Facundo Torres</h2>
                <p>🇺🇾 Nuevo fichaje</p>
            </div>

            <div class="tarjeta">
                <h2>🔥 Nuevo delantero</h2>
                <p>El equipo busca reforzar el ataque.</p>
            </div>

            <div class="tarjeta">
                <h2>🧤 Nuevo arquero</h2>
                <p>Se busca reforzar la portería.</p>
            </div>
        `;
    }
}


function mostrarListaEquipos(lista) {

    let contenedor = document.getElementById("listaEquipos");

    contenedor.innerHTML = "";

    lista.forEach(function(equipo) {

        contenedor.innerHTML += `
            <div class="tarjeta">
                ⚽ ${equipo}
            </div>
        `;

    });
}


function buscarEquipo() {

    let texto = document
        .getElementById("buscarEquipo")
        .value
        .toLowerCase();

    let resultados = equipos.filter(function(equipo) {
        return equipo.toLowerCase().includes(texto);
    });

    mostrarListaEquipos(resultados);
}


function mostrarListaJugadores(lista) {

    let contenedor = document.getElementById("listaJugadores");

    contenedor.innerHTML = "";

    lista.forEach(function(jugador) {

        contenedor.innerHTML += `
            <div class="tarjeta">
                👤 ${jugador}
            </div>
        `;

    });
}


function buscarJugador() {

    let texto = document
        .getElementById("buscarJugador")
        .value
        .toLowerCase();

    let resultados = jugadores.filter(function(jugador) {
        return jugador.toLowerCase().includes(texto);
    });

    mostrarListaJugadores(resultados);
}


mostrar("inicio");

</script>

</body>

</html>
