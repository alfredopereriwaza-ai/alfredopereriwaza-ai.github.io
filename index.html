           DISEÑO GENERAL
        ========================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101010;
            color: white;
            transition: 0.3s;
        }

        body.claro {
            background: #eeeeee;
            color: #111111;
        }

        nav {
            background: #191919;
            padding: 12px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav button {
            background: #292929;
            color: white;
            border: none;
            padding: 10px 13px;
            margin: 4px;
            border-radius: 8px;
            cursor: pointer;
        }

        nav button:hover {
            background: #00a866;
        }

        .contenido {
            max-width: 1000px;
            margin: auto;
            padding: 30px 15px;
            text-align: center;
        }

        h1 {
            color: #00ff88;
        }

        h2 {
            color: #00ff88;
        }

        .tarjeta {
            background: #1c1c1c;
            border: 1px solid #292929;
            padding: 20px;
            margin: 15px auto;
            border-radius: 15px;
            max-width: 700px;
        }

        body.claro .tarjeta {
            background: white;
            border-color: #ddd;
        }

        .boton {
            background: #00a866;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
            font-size: 15px;
        }

        .boton:hover {
            background: #00cc7a;
        }

        .buscador {
            width: 90%;
            max-width: 550px;
            padding: 13px;
            border-radius: 8px;
            border: none;
            margin: 15px;
            font-size: 16px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            max-width: 850px;
            margin: auto;
        }

        .mini {
            background: #1c1c1c;
            border: 1px solid #292929;
            padding: 20px;
            border-radius: 15px;
        }

        body.claro .mini {
            background: white;
            border-color: #ddd;
        }

        .escudo {
            font-size: 45px;
        }

        .puntos {
            font-size: 24px;
            color: #00ff88;
            font-weight: bold;
        }

        .correcto {
            color: #00ff88;
            font-weight: bold;
        }

        .incorrecto {
            color: #ff4444;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        @media(max-width:600px) {

            nav button {
                font-size: 12px;
                padding: 8px;
            }

            .contenido {
                padding: 20px 10px;
            }

        }

    </style>
</head>

function mostrarEquipos(lista) {

    const contenedor =
        document.getElementById("listaEquipos");

    contenedor.innerHTML = "";


    lista.forEach(function(equipo) {

        contenedor.innerHTML += `

            <div class="mini">

                <div class="escudo">
                    ${equipo.escudo}
                </div>

                <h2>
                    ${equipo.nombre}
                </h2>

                <button
                    class="boton"
                    onclick="verEquipo('${equipo.nombre}')">

                    Ver equipo

                </button>

            </div>

        `;

    });

}


function buscarEquipo() {

    const texto =
        document
        .getElementById("buscarEquipo")
        .value
        .toLowerCase();


    const resultados =
        equipos.filter(function(equipo) {

            return equipo.nombre
                .toLowerCase()
                .includes(texto);

        });


    mostrarEquipos(resultados);

}


function verEquipo(nombre) {

    const equipo =
        equipos.find(function(e) {

            return e.nombre === nombre;

        });


    document.getElementById("contenido")
        .innerHTML = `

            <h1>
                ${equipo.escudo}
                ${equipo.nombre}
            </h1>

            <div class="tarjeta">

                ← Volver

}

    tabla.forEach(function(equipo, indice) {

                </h2>

                    ${equipo.puntos}

                </p>

            </div>

        `;

    });


    document.getElementById("contenido")
        .innerHTML = html;

}


/* =====================================================
   QUIZ
===================================================== */

let pregunta = 0;

let puntos = 0;


const preguntas = [

    {
        texto: "¿Cuántos jugadores tiene un equipo en cancha?",
        opciones: ["9", "10", "11", "12"],
        correcta: "11"
    },

    {
        texto: "¿Qué tarjeta significa expulsión?",
        opciones: ["Azul", "Amarilla", "Roja", "Verde"],
        correcta: "Roja"
    },

    {
        texto: "¿Qué selección ganó el Mundial 2022?",
        opciones: ["Argentina", "Brasil", "Francia", "Uruguay"],
        correcta: "Argentina"
    },

    {
        texto: "¿Qué posición ocupa normalmente el arquero?",
        opciones: ["Ataque", "Portería", "Mediocampo", "Defensa"],
        correcta: "Portería"
    },

    { texto: "¿Quien ganó la champions en 2026?",
        opciones: ["PSG", "Nacional", "Arsenal", "Manchester City"],
       correcta: "PSG"
    },
];


function quiz() {

    pregunta = 0;

    puntos = 0;

    mostrarPregunta();

}


function mostrarPregunta() {

    if (pregunta >= preguntas.length) {

        document.getElementById("contenido")
            .innerHTML = `

                <h1>
                    🏆 Quiz terminado
                </h1>

                <div class="tarjeta">

                    <h2>
                        ${puntos}
                        /
                        ${preguntas.length}
                    </h2>

                    <button
                        class="boton"
                        onclick="quiz()">

                        🔄 Otra vez

                    </button>

                </div>


            `;

        return;

    }


    const p =
        preguntas[pregunta];


    let botones = "";


    p.opciones.forEach(function(opcion) {

        botones += `

            <button
                class="boton"
                onclick="responder('${opcion}')">

                ${opcion}

            </button>

        `;

    });


    document.getElementById("contenido")
        .innerHTML = `

            <h1>
                🧠 Quiz
            </h1>

            <div class="tarjeta">

                <h2>
                    ${p.texto}
                </h2>

                ${botones}

                <p>
                    Pregunta
                    ${pregunta + 1}
                    /
                    ${preguntas.length}
                </p>

            </div>

        `;

}


function responder(respuesta) {

    if (
        respuesta ===
        preguntas[pregunta].correcta
    ) {

        puntos++;

    }


    pregunta++;

    mostrarPregunta();

}


/* =====================================================
   PENALES
===================================================== */

let goles = 0;

let tiros = 0;


function penales() {

    goles = 0;

    tiros = 0;

    mostrarPenales();

}


function mostrarPenales() {

    document.getElementById("contenido")
        .innerHTML = `

            <h1>
                🥅 Penales
            </h1>

            <div class="tarjeta">

                <h2>
                    ⚽ ${goles}
                    |
                    🎯 ${tiros}/5
                </h2>

                <button
                    class="boton"
                    onclick="patear('izquierda')">

                    ⬅️ Izquierda

                </button>


                <button
                    class="boton"
                    onclick="patear('centro')">

                    ⬆️ Centro

                </button>


                <button
                    class="boton"
                    onclick="patear('derecha')">

                    ➡️ Derecha

                </button>


                <div id="resultadoPenal"></div>

            </div>

        `;

}


function patear(direccion) {

    if (tiros >= 5) {

        return;

    }


    const opciones = [
        "izquierda",
        "centro",
        "derecha"
    ];


    const arquero =
        opciones[
            Math.floor(
                Math.random() *
                opciones.length
            )
        ];


    tiros++;


    if (direccion !== arquero) {

        goles++;

        document.getElementById("resultadoPenal")
            .innerHTML =
            "<h2>⚽ ¡GOOOOOL!</h2>";

    }

    else {

        document.getElementById("resultadoPenal")
            .innerHTML =
            "<h2>🧤 ¡ATAJÓ!</h2>";

    }


    setTimeout(function() {

        if (tiros >= 5) {

            document.getElementById("contenido")
                .innerHTML = `

                    <h1>
                        🏆 Final
                    </h1>

                    <div class="tarjeta">

                        <h2>
                            ${goles}
                            goles de 5
                        </h2>

                        <button
                            class="boton"
                            onclick="penales()">

                            🔄 Otra vez

                        </button>

                    </div>

                `;

        }

        else {

            mostrarPenales();

        }

    }, 700);

}

            `;

    }

    else {

        mostrarCarrera();

    }

}


function elegirEquipo(nombre) {

    miEquipo = nombre;

    puntosCarrera = 0;

    mostrarCarrera();

}


function mostrarCarrera() {

    document.getElementById("contenido")
        .innerHTML = `

            <h1>
                🏆 Modo Carrera
            </h1>

            <div class="tarjeta">

                <h2>
                    ${miEquipo}
                </h2>

                <p>
                    ⭐ Puntos:
                    ${puntosCarrera}
                </p>

                <button
                    class="boton"
                    onclick="jugarPartido()">

                    ⚽ Jugar partido

                </button>


                <button
                    class="boton"
                    onclick="reiniciarCarrera()">

                    🔄 Cambiar equipo

                </button>

            </div>

        `;

}


function jugarPartido() {

    const resultado =
        Math.floor(
            Math.random() * 3
        );


    if (resultado === 0) {

        puntosCarrera += 3;

        alert("🔥 ¡GANASTE! +3 puntos");

    }

    else if (resultado === 1) {

        puntosCarrera += 1;

        alert("🤝 ¡EMPATE! +1 punto");

    }

    else {

        alert("❌ PERDISTE");

    }


    mostrarCarrera();

}


function reiniciarCarrera() {

    miEquipo = null;

    puntosCarrera = 0;

    modoCarrera();

}


/* =====================================================
   MODO OSCURO / CLARO
===================================================== */

function cambiarTema() {

    document.body.classList.toggle("claro");

}


/* =====================================================
   INICIAR
===================================================== */

mostrar("inicio");

</script>
